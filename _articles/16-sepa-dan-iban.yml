  <p><strong>Jawab:</strong></p>
  <p>
    SEPA <em>(Single Europe Payment Area)</em> merupakan inisiatif Uni Eropa dalam mengharmonisasikan pembayaran Euro. Sementara itu, IBAN <em>(International Bank Account Number)</em> merupakan nomor rekening yang berlaku internasional. Dengan SEPA, kita dapat melakukan transaksi Euro (transfer/pembayaran/lainnya) dengan cepat.
  </p>
