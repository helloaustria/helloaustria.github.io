  <h2 id="pendahuluan">Pendahuluan</h2>
  <p>
    Trem merupakan salah satu transportasi publik andalan di Vienna. Dengan trem, teman-teman bisa menjelajahi berbagai tempat di Vienna
  </p>
  <h2 id="langkah-langkah">Langkah-Langkah</h2>
  <ol>
    <li>
      Buka Google Maps, pilih tempat asal dan tujuan yang diinginkan kemudian pilih rute yang menggunakan trem. Perhatikan nomor trem dan kapan <em>stop</em> harus berpindah trem (jika diperlukan).
    </li>
    <li>Pergi ke <em>stop </em>trem sesuai Google Maps kemudian tunggu hingga trem datang dan berhenti.</li>
    <li>
      Kalau pintu trem tidak terbuka, tekan tombol buka &quot;<strong>(&lt;&gt;)</strong>&quot; yang ada di pintu. Jika pintu sudah terbuka, silakan masuk.
    </li>
    <li>
      Di dalam trem, silakan bebas pilih area. Bisa duduk ataupun berdiri. Hal yang perlu diperhatikan adalah ada <strong>area prioritas</strong> seperti untuk lansia, ibu hamil, atau yang membawa anjing. Sesuaikan dengan keadaan.
    </li>
    <li>Jika sudah sampai <em>stop </em>tujuan, silakan turun atau berganti trem (jika diperlukan).</li>
    <li>Selesai.</li>
  </ol>
  <h2 id="catatan-pengalaman-pribadi">Catatan Pengalaman Pribadi</h2>
  <ul>
    <li>Unduh aplikasi <strong>WienMobil</strong> (Android/iOS) untuk memudahkan kita menggunakan trem.</li>
    <li>
      <strong>Rekomendasi:</strong> Beli tiket <em>annual pass</em> karena trem (dan pendukungnya) akan menjadi moda transportasi utama kita di Austria
    </li>
    <li>
      Pembuatan <em>annual pass</em> perlu foto. Siapkan foto terbaik untuk masuk kedalam tiket <em>annual pass</em>.
    </li>
    <li>
      Terdapat 2 jenis <em>annual pass</em>: <strong>normal</strong> atau <strong>digital </strong>(harga sama).
      <ul>
        <li>
          <strong>Normal: </strong><em>physical card</em> + <em>digital card</em> (aplikasi)
          <ul>
            <li>Kartu fisik akan dikirimkan ke alamat dalam 1-2 minggu setelah pengajuan pembuatan.</li>
          </ul>
        </li>
        <li><strong>Digital:</strong> <em>digital card</em>.</li>
      </ul>
    </li>
    <li>
      Selalu perhatikan <em>next stop</em> trem selanjutnya. Jika <em>next stop</em> tersebut adalah tujuan kita, pastikan kita menekan tombol &quot;<strong>(&lt;&gt;)</strong>&quot; di pintu (jika belum ada yang menekannya). Kalau tidak, pintu tidak akan terbuka.
    </li>
    <li>
      Sebisa mungkin, jika tujuan kita agak jauh, JANGAN berdiri dekat pintu. Jika berdiri dekat pintu, beri prioritas orang yang mau keluar dulu dengan cara kita keluar dulu setelah itu masuk lagi.
    </li>
    <li>Ngobrol di dalam trem oke, tapi lihat situasi sekitar.</li>
  </ul>
