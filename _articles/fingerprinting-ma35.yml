  <h2 id="pendahuluan">Pendahuluan</h2>
  <p>
    Proses terakhir yang perlu kita lakukan untuk menetapkan status residensi kita di Austria adalah dengan memproses dan mendapatkan kartu izin tinggal <em>(residence permit card)</em>. Seharusnya, pada saat kita sampai di Austria hal yang perlu kita lakukan adalah tinggal mengambil kartu izin tinggal kita di MA35. Akan tetapi, pada saat saya ke MA35, mereka menyampaikan bahwa mereka tidak menerima data biometrik kita sehingga prosesnya harus sedikit lebih “mundur” menjadi pengambilan data biometrik terlebih dahulu <em>(fingerprinting)</em> kemudian dilanjut pengambilan kartu izin tinggal pada jadwal berikutnya. Oleh karena itu, tulisan ini akan menguraikan bagaimana membuat janji temu dan pengambilan data biometrik di MA35.
  </p>
  <h2 id="prasyarat">Prasyarat</h2>
  <ul>
    <li>Sudah melakukan registrasi alamat</li>
    <li>Sudah memiliki OGK</li>
  </ul>
  <h2 id="dokumen-dokumen-yang-diperlukan">Dokumen-Dokumen yang Diperlukan</h2>
  <ul>
    <li>Paspor</li>
    <li>Visa D</li>
    <li>Pas foto dengan kriteria EU</li>
    <li>SKCK + apostil</li>
    <li>Akta kelahiran + apostil</li>
    <li><em>Bestatigung der meldung</em></li>
    <li><em>OGK health insurance confirmation</em></li>
    <li>Dokumen lain yang diperlukan (jika ada)</li>
  </ul>
  <h2 id="langkah-langkah">Langkah-Langkah</h2>
  <ol>
    <li>
      Buat janji temu dengan MA35 terlebih dahulu melalui <em>email</em>. Pada kasus saya, saya tinggal di Wina, sehingga <em>email</em> janji temu dikirimkan ke alamat <a href="mailto:businessimmigration@ma35.wien.gv.at">businessimmigration@ma35.wien.gv.at</a>. Berikut contoh <em>email</em> janji temu yang saya kirimkan:
      <figure class="guide-figure">
        <img src="/assets/images/fingerprinting-ma35-01-contoh-email-janji-temu-izin-tinggal-ke-ma35.png" alt="Gambar 1. Contoh email janji temu izin tinggal ke MA35" width="1404" height="579" loading="eager" decoding="async" fetchpriority="high">
        <figcaption>Gambar 1. Contoh <em>email</em> janji temu izin tinggal ke MA35</figcaption>
      </figure>
    </li>
    <li>
      Teman-teman akan menerima balasan <em>email</em> berupa jadwal janji temu ke MA35 untuk memproses izin tinggal teman-teman. Gambar 2 menunjukkan contoh balasan <em>email</em> yang diberikan. Catat jadwal dan tempat janji temu yang diberikan.
      <figure class="guide-figure">
        <img src="/assets/images/fingerprinting-ma35-02-email-balasan-janji-temu-dari-ma35.png" alt="Gambar 2. Email balasan janji temu dari MA35" width="1470" height="745" loading="lazy" decoding="async">
        <figcaption>Gambar 2. <em>Email</em> balasan janji temu dari MA35</figcaption>
      </figure>
    </li>
    <li>
      Datang sesuai jadwal dan tempat janji temu MA35 yang telah disepakati. Di depan ruangan, umumnya akan ada petugas yang akan menanyakan urusan kita ke MA35. Sampaikan kepada petugas tersebut bahwa kita ada janji temu dengan MA35 untuk memproses izin tinggal kita, kemudian tunjukkan <em>email</em> janji temu kita.
    </li>
    <li>
      Setelah diizinkan masuk oleh petugas, ambil tiket antrian untuk resepsionis BIO <em>(Business Immigration Office)</em>. Tunggu hingga nomor antrian kita dipanggil kemudian sampaikan bahwa kita hendak memproses izin tinggal kita dan serahkan seluruh berkas yang kita bawa.
      <figure class="guide-figure">
        <img src="/assets/images/fingerprinting-ma35-03-contoh-tiket-antrian-bio.jpg" alt="Gambar 3. Contoh tiket antrian BIO" width="2382" height="2344" loading="lazy" decoding="async" style="width:auto;max-width:min(338px,100%)">
        <figcaption>Gambar 3. Contoh tiket antrian BIO</figcaption>
      </figure>
    </li>
    <li>
      Setelah berkas kita dievaluasi oleh resepsionis BIO, kita akan diberikan tiket antrian untuk ke ruang evaluasi lebih lanjut.
      <figure class="guide-figure">
        <img src="/assets/images/fingerprinting-ma35-04-contoh-tiket-antrian-ruang-tunggu-b-wartebereich-b.jpg" alt="Gambar 4. Contoh tiket antrian ruang tunggu B (wartebereich B)" width="2542" height="2191" loading="lazy" decoding="async" style="width:auto;max-width:min(338px,100%)">
        <figcaption>Gambar 4. Contoh tiket antrian ruang tunggu B <em>(wartebereich B)</em></figcaption>
      </figure>
    </li>
    <li>
      Setelah nomor antrian kita dipanggil, masuk ke ruangan yang diberikan. Serahkan semua berkas yang diperlukan kemudian petugas akan mengevaluasi berkasnya lebih lanjut.
    </li>
    <li>
      Jika berkas oke, petugas kemudian akan mengambil data biometrik kita berupa <em>fingerprinting</em>.
    </li>
    <li>
      Setelah semua proses oke maka petugas akan membuatkan janji temu selanjutnya untuk proses pengambilan kartu izin tinggal. Umumnya, proses ini akan membutuhkan 9 hari setelah proses pengambilan data biometrik kita.
    </li>
    <li>Selesai.</li>
  </ol>
  <h2 id="catatan-pengalaman-pribadi">Catatan Pengalaman Pribadi</h2>
  <ul>
    <li>Datang sepagi mungkin ke kantor MA35. Disarankan antara pukul 9 pagi s.d. 11 siang.</li>
    <li>
      <strong>Penting!</strong> Pastikan pas foto kita sudah sesuai dengan kriteria EU, baik itu ukuran cetak foto maupun rasio wajah terhadap badan di foto.
    </li>
    <li>
      <em>OGK Health Insurance Confirmatio</em> merupakan semacam dokumen yang menerangkan bahwa kita sudah terdaftar di OGK. Berikut contoh dari dokumen tersebut:
      <figure class="guide-figure">
        <img src="/assets/images/fingerprinting-ma35-05-contoh-dokumen-ogk-health-insrance-confirmation-letter.png" alt="Gambar 5. Contoh dokumen OGK Health Insrance Confirmation letter (sumber: dokumentasi pribadi)" width="497" height="706" loading="lazy" decoding="async" style="width:auto;max-width:min(400px,100%)">
        <figcaption>
          Gambar 5. Contoh dokumen <em>OGK Health Insrance Confirmation letter</em> (sumber: dokumentasi pribadi)
        </figcaption>
      </figure>
    </li>
  </ul>
