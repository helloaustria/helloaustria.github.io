  <p><strong>Jawab:</strong></p>
  <p>Ini merupakan salah satu pertanyaan dengan jawaban yang "abu-abu". Jika <em>dorm</em> Anda merupakan <em>apartment studio</em>, dengan <em>kitchen</em>, maka jawabannya tentu boleh. Akan tetapi, jika <em>dorm</em> Anda merupakan <em>single room</em> dengan <em>shared kitchen</em> maka ketahuilah bahwa di setiap ruangan terdapat <em>alarm</em> kebakaran. Jika terjadi suatu <em>false alarm</em> (misal, asap dan uap air berlebih) maka dapat menimbulkan konsekuensi finansial yang harus Anda tanggung.</p>
