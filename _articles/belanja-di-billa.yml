  <h2 id="jenis-jenis-billa">Jenis-Jenis Billa</h2>
  <p>Ada 3 jenis Billa yang bisa ditemukan:</p>
  <ul>
    <li><strong>Billa</strong>,</li>
    <li><strong>Billa Plus</strong>, Billa dengan variasi stok yang jauh lebih lengkap</li>
    <li>
      <strong>Billa Corso</strong>, hanya ditemukan di beberapa tempat tertentu (salah satunya di Stephansplatz)
    </li>
  </ul>
  <h2 id="langkah-langkah">Langkah-langkah</h2>
  <ol>
    <li>Masuk ke Billa dan ambil keranjang belanjanya.</li>
    <li>Ambil seluruh barang yang ingin dibeli dan masukkan kedalam keranjang.</li>
    <li>
      Jika sudah selesai, antri di kasir untuk proses pembayaran.
      <p>Tersedia 2 jenis metode pembayaran:</p>
      <ul>
        <li>Kas</li>
        <li>Kartu debit/kartu kredit <strong>(direkomendasikan)</strong></li>
      </ul>
    </li>
    <li>Bayar dan selesai.</li>
  </ol>
  <h2 id="catatan-pengalaman-pribadi">Catatan Pengalaman Pribadi</h2>
  <ul>
    <li>
      Billa adalah toko kebutuhan sehari-hari. Serupa dengan Alfamart dan Indomaret di Indonesia, tetapi <strong><u>tidak sama</u></strong>. Billa lebih berfokus pada kebutuhan pangan. Jadi, jangan berekspektasi untuk menemukan barang-barang seperti pulpen, mainan, dsb. di Billa. Itu bukan tempatnya.
    </li>
    <li>
      Disarankan membawa kantung belanja sendiri. Billa tidak menyediakan kantung plastik, kecuali beli (misal, <em>paper bag</em>).
    </li>
    <li>
      Tugas kasir hanya <strong>menyelesaikan proses transaksi</strong>. Jadi, kasir tidak memasukkan belanjaan ke kantung belanja, kita sendiri yang bertanggung jawab. Jadi, biasanya setelah di-<em>scan</em>, taruh barang belanjaannya di keranjang kembali. Kemudian, akan ada meja yang disediakan khusus. Nah, disitu baru kita bisa merapikan barang belanjaan kita.
      <figure class="guide-figure">
        <img src="/assets/images/belanja-di-billa-02-contoh-meja-yang-disediakan-untuk-merapikan-barang-belanja.jpg" alt="Gambar 2. Contoh meja yang disediakan untuk merapikan barang belanjaan" width="1280" height="960" loading="lazy" decoding="async">
        <figcaption>Gambar 2. Contoh meja yang disediakan untuk merapikan barang belanjaan</figcaption>
      </figure>
    </li>
    <li>
      <strong>Billa hanya buka Senin s.d. Sabtu.</strong> Hari Nasional dan Minggu libur (kecuali beberapa jenis dan cabang Billa).
    </li>
  </ul>
