  <h2 id="pendahuluan">Pendahuluan</h2>
  <p>
    Perlu belanja kebutuhan pangan sehari-hari? Cari toko yang mirip dengan Alfamart dan Indomaret di Indonesia? Tentu, <strong>Billa</strong> jawabannya! Sebenarnya, ada beberapa alternatif lain seperti <strong>Spar</strong>, <strong>Hofer</strong>, dan lain sebagainya. Akan tetapi, saya lebih menyukai Billa karena harganya yang murah, variasi banyak, dan tokonya mudah ditemukan dimana-mana.
  </p>
  <figure class="guide-figure">
    <img src="/assets/images/belanja-di-billa-01-contoh-barang-barang-yang-dijual-di-billa.jpg" alt="Gambar 1. Contoh barang-barang yang dijual di Billa" width="720" height="1280" loading="eager" decoding="async" fetchpriority="high" style="width:auto;max-width:min(400px,100%)">
    <figcaption>Gambar 1. Contoh barang-barang yang dijual di Billa</figcaption>
