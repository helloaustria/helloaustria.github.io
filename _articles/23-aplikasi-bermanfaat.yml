  <p><strong>Jawab:</strong></p>
  <p>Berikut beberapa aplikasi yang mungkin bermanfaat selama teman-teman berada di Austria:</p>
  <ul>
    <li>
      <strong>Bank Austria,</strong> jika berencana/sudah menjadi nasabah Bank Austria (unduh <a href="https://play.google.com/store/apps/details?id=com.bankaustria.android.olb" target="_blank" rel="noopener noreferrer">disini</a>)
    </li>
    <li>
      <strong>Educom,</strong> jika menggunakan operator Educom untuk keperluan membeli paket data dan memantai sisa kuota (unduh <a href="https://play.google.com/store/apps/details?id=at.edustore.educom" target="_blank" rel="noopener noreferrer">disini</a>)
    </li>
    <li>
      <strong>WienMobil,</strong> untuk menaiki transportasi WienMobil (U-banh, S-banh, etc) karena di dalamnya terdapat tiket kita sebagai tanda bukti (unduh <a href="https://play.google.com/store/apps/details?id=at.wienerlinien.wienmobillab" target="_blank" rel="noopener noreferrer">disini</a>)
    </li>
    <li>
      <strong>Billa dan jo Bonus Club,</strong> jika sering berbelanja di Billa (untuk poin loyalitas) (unduh <a href="https://play.google.com/store/apps/details?id=at.billa.service" target="_blank" rel="noopener noreferrer">disini</a> dan <a href="https://play.google.com/store/apps/details?id=at.joeclub.app.joecard" target="_blank" rel="noopener noreferrer">disini</a>)
    </li>
    <li>
      <strong>Lavis,</strong> jika <em>dorm</em> teman-teman menggunakannya sebagai vendor pihak ketiga untuk <em>laundry</em> (<a href="/articles/laundry-lavis/">klik disini</a>) (unduh <a href="https://play.google.com/store/apps/details?id=com.innovationscript.lavis" target="_blank" rel="noopener noreferrer">disini</a>)
    </li>
    <li>
      <strong>IZW,</strong> bagi muslim untuk memantau waktu sholat (unduh <a href="https://play.google.com/store/apps/details?id=com.masjidbox.izwdeutsch5ee55759c40dc100163983fb" target="_blank" rel="noopener noreferrer">disini</a>)
    </li>
    <li>
      <strong>Microsoft Authenticator,</strong> untuk otentikasi akun jika kampus menggunakan akun Microsoft (unduh <a href="https://play.google.com/store/apps/details?id=com.azure.authenticator" target="_blank" rel="noopener noreferrer">disini</a>)
    </li>
    <li>
      <strong>Microsoft Teams,</strong> untuk komunikasi internal kampus jika menggunakan akun Microsoft (unduh <a href="https://play.google.com/store/apps/details?id=com.microsoft.teams" target="_blank" rel="noopener noreferrer">disini</a>)
    </li>
    <li>
      <strong>Microsoft Outlook,</strong> untuk <em>email</em> internal kampus jika menggunakan akun Microsoft (unduh <a href="https://play.google.com/store/apps/details?id=com.microsoft.office.outlook" target="_blank" rel="noopener noreferrer">disini</a>)
    </li>
  </ul>
