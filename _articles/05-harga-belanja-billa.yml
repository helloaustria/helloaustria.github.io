  <p><strong>Jawab:</strong></p>
  <p>
    Asumsi untuk makan satu porsi makanan di restoran berkisar 12 - 15 Euro. Dengan 12 Euro yang sama, di Billa teman-teman bisa mendapatkan:
  </p>
  <ul>
    <li>Satu <em>salad with grilled chicken</em> yang sedang diskon 25%</li>
    <li>Dua kaleng <em>Clever Herings Filets in Senfsauce</em></li>
    <li>Satu <em>Clever Stapel Chips</em> 175 gram</li>
    <li>Satu <em>Clever Cappuccino</em> 250 mL</li>
    <li>Satu kotak tisu isi 100 lembar</li>
  </ul>
  <p>Atau, dengan harga yang lebih murah, 11 Euro, di Billa teman-teman bisa mendapatkan:</p>
  <ul>
    <li>Satu <em>Billa Couscous Salat</em> yang sedang diskon 25%</li>
    <li>Tiga kaleng <em>Clever Herings Filets in Senfsauce</em></li>
    <li>Satu <em>Clever Geback Stangen Meersalz</em></li>
    <li>Satu <em>Clever Cappuccino</em> 250 mL</li>
    <li>Satu <em>Clever Macchiato</em> 250 mL</li>
  </ul>
  <p>Jadi, belanja di Billa murah kan?</p>
