  <p><strong>Jawab:</strong></p>
  <p>
    Mungkin ini adalah pertanyaan bagi mereka (termasuk saya) yang sudah berkeluarga, memiliki anak, dan hendak membawa keluarganya untuk tinggal bersama di Austria. Pada kasus ini, tidak semua toko menyediakan susu bayi. Dalam survei saya, susu bayi bisa ditemukan di <strong><u>Billa Plus</u></strong> (dalam survei saya, di <a href="https://maps.app.goo.gl/x6t7raQGRhpVDf2e9" target="_blank" rel="noopener noreferrer">Billa Plus Handelskai</a> dekat Millenium City, Vienna).
  </p>
  <p>
    Di <a href="https://maps.app.goo.gl/x6t7raQGRhpVDf2e9" target="_blank" rel="noopener noreferrer">Billa Plus Handelskai</a>, susu bayi dapat dapat ditemukan di rak bertuliskan<strong> “Babynahrung”</strong> (makanan bayi). Penting diperhatikan bahwa merek susu yang dijual di Austria berbeda dengan yang dijual di Indonesia. Contoh merek susu yang dijual di Austria adalah <strong>Aptamil</strong> dan <strong>Beba</strong> (Nestle). Jadi, pastikan teman-teman memperkenalkan susunya ke anak supaya bisa beradaptasi dengan rasanya ya…
  </p>
