  <p><strong>Jawab:</strong></p>
  <p>
    Sebagian besar toko, terutama Billa, tutup di hari Minggu. Jadi, pastikan sudah berbelanja maksimal hari Sabtu setiap minggunya. Akan tetapi, jika mendadak perlu membeli bahan pokok di hari Minggu, beberapa toko tetap buka di hari Minggu. Seperti misalkan, beberapa toko di beberapa <em>gas station</em> tetap buka di hari Minggu (dengan konsekuensi harga yang lebih mahal). Solusi lain, <strong>Billa Corso Stephansplatz</strong> (map <a href="https://maps.app.goo.gl/z1gbCXsiYGfcvCYL8" target="_blank" rel="noopener noreferrer">klik disini</a>) tetap buka di hari Minggu dengan harga yang sama dengan Billa lainnya.
  </p>
