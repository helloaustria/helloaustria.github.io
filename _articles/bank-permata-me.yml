  <p><strong>Jawab:</strong></p>
  <p>
    Pada kasus saya, aplikasi Permata ME tidak bisa dibuka menggunakan jaringan internet di Austria. Jika teman-teman menggunakan aplikasi Permata ME dan mengalami kasus yang serupa, solusinya pakai <strong>VPN</strong> (atau <strong>VPN premium</strong>). Caranya sebagai berikut:
  </p>
  <ol>
    <li>Aktifkan VPN kita.</li>
    <li>Untuk lokasi servernya, pilih <strong>Indonesia</strong>.</li>
    <li>Tutup dan buka ulang aplikasi Permata ME.</li>
    <li>Selesai.</li>
  </ol>
