  <h2 id="pendahuluan">Pendahuluan</h2>
  <p>
    OGK <em>(Österreichische Gesundheitskasse)</em> merupakan asuransi kesehatan nasional Austria. OGK wajib dimiliki sebagai salah satu prasyarat izin tinggal di Austria. Selain itu, OGK juga penting untuk menjamin kesehatan kita selama berada di Austria.
  </p>
  <h2 id="tempat-pendaftaran">Tempat Pendaftaran</h2>
  <p>ÖGK Kundenservice Wien Wienerberg - Österreichische Gesundheitskasse</p>
  <p>Wienerbergstraße 15-19 (EG)</p>
  <p>1100 Wien</p>
  <p>T: +43 5 0766-118000</p>
  <p>
    Map: <a href="https://maps.app.goo.gl/6rVASe1fMz78Npqq6" target="_blank" rel="noopener noreferrer">https://maps.app.goo.gl/6rVASe1fMz78Npqq6</a>
  </p>
  <h2 id="biaya">Biaya</h2>
  <p>73.48 Euro per bulan</p>
  <h2 id="persyaratan">Persyaratan</h2>
  <ul>
    <li>Paspor</li>
    <li>Dokumen <em>proof of address</em> <em>(bestatigung der meldung)</em></li>
    <li><em>Confirmation of enrolment (Studienbestätigung)</em></li>
    <li><em>Current sheet of the Studienbuchblatt (proof of current enrolment)</em></li>
    <li><em>Scholarship award letter by the OeAD</em></li>
    <li>Rekening Bank Austria <strong>(rekomendasi)</strong></li>
  </ul>
  <h2 id="langkah-langkah">Langkah-langkah</h2>
  <ol>
    <li>
      Isi <em>form</em> pendaftaran OGK <em>(</em><a href="https://www.gesundheitskasse.at/cdscontent/load?contentid=10008.728203&amp;version=1577443352" target="_blank" rel="noopener noreferrer"><em>link</em></a><em>)</em>. Untuk panduan cara pengisian bisa lihat <em>link</em> sebagai berikut:
      <p class="file-download">
        <a href="/assets/files/pendaftaran-ogk-01-antrag-gk-ausfllhilfe-e-20200120-pdf.pdf"><span class="file-name">Antrag ÖGK Ausfüllhilfe E 20200120.pdf</span><span class="file-size">4 MB</span></a>
      </p>
    </li>
    <li>
      Datang ke kantor OGK pusat, kemudian pergi ke area <em>customer service</em>. Area ini ditandai dengan tanda berwarna hijau dan terletak dibelakang <em>check-in information section</em>.
    </li>
    <li>
      Pergi ke <strong>konter C </strong><em><strong>(selbstversicherung)</strong></em>, kemudian ambil nomor antrian. Tunggu hingga nomor antrian dipanggil.
    </li>
    <li>
      Sampaikan kepada petugas bahwa kita adalah <em>student</em> dan hendak mendaftar untuk OGK selama tinggal di Austria. Serahkan seluruh dokumen yang dibutuhkan.
    </li>
    <li>
      Petugas akan memproses dokumen kita. Jika sudah oke, maka kita akan mendapatkan semacam <em>health insurance confirmation letter</em> berikut dengan nomor asuransi kita. Berikut contoh <em>letter</em> yang dimaksud:
      <figure class="guide-figure">
        <img src="/assets/images/pendaftaran-ogk-02-contoh-ogk-health-insurance-confirmation-letter.png" alt="Gambar 1. Contoh OGK health insurance confirmation letter (sumber: dokumentasi pribadi)" width="497" height="706" loading="eager" decoding="async" fetchpriority="high" style="width:auto;max-width:min(400px,100%)">
        <figcaption>
          Gambar 1. Contoh <em>OGK health insurance confirmation letter</em> (sumber: dokumentasi pribadi)
        </figcaption>
      </figure>
    </li>
    <li>
      <em>Scan</em> dokumen <em>health insurance confirmation letter</em> tersebut karena ini (mungkin) akan dibutuhkan pada saat proses pengambilan <em>residence permit</em>.
    </li>
    <li>Selesai.</li>
  </ol>
  <h2 id="catatan">Catatan</h2>
  <ul>
    <li>
      Pendaftaran OGK tidak perlu <em>appointment</em> terlebih dahulu. Hal yang perlu dilakukan adalah datang sepagi mungkin (disarankan, jam 9 pagi s.d. 11 siang).
    </li>
    <li>Letak kantor OGK cukup jauh, jadi pastikan sediakan waktu yang cukup.</li>
    <li>
      Jika memilih autodebit, proses autodebit akan dilakukan setiap tanggal 15-20 di setiap bulannya. Pastikan saldo rekening cukup.
    </li>
    <li>
      Biaya pertama tidak selalu total 73.48 Euro. Biaya pertama adalah 73.48 Euro untuk bulan selanjutnya + sisa bulan berjalan.
    </li>
    <li>
      Peserta OGK akan mendapatkan <em>e-card</em>. Proses pembuatan <em>e-card</em> dilakukan melalui <em>website</em> setelah pendaftaran OGK selesai (informasi tata cara pembuatan <em>e-card</em> klik <a href="/articles/pembuatan-e-card/">disini</a>) dan kartu akan dikirimkan melalui pos. Petugas akan menginformasikannya lebih lanjut.
    </li>
    <li>
      Jika OGK tidak memberikan <em>OGK health insurance confirmation letter</em>, sampaikan kepada mereka bahwa kita akan meng-<em>apply residence permit</em> sehingga memerlukan dokumen tersebut.
    </li>
  </ul>
