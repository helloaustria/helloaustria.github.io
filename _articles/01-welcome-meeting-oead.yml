  <h2 id="apa-itu-welcome-meeting-oead">Apa itu Welcome Meeting OeAD?</h2>
  <p>
    Pada dasarnya, <em>welcome meeting</em> OeAD ini bertujuan untuk dua hal esensial, yaitu <strong>konfirmasi </strong><em><strong>scholarship</strong></em> dan <em><strong>travel reimbursement</strong></em>.
  </p>
  <h2 id="prasyarat">Prasyarat</h2>
  <p>
    Sudah melakukan registrasi alamat (dibuktikan dengan dokumen <em>proof of address</em> atau <em>bestatigung der meldung</em>).
  </p>
  <h2 id="dokumen-dokumen-yang-diperlukan">Dokumen-Dokumen yang Diperlukan</h2>
  <ol>
    <li>Paspor</li>
    <li>
      <em>Health insurance</em> (untuk <u>sementara</u> boleh menggunakan <em>travel health insurance</em>)
    </li>
    <li><em>Proof of address</em> (dokumen <em>bestatigung der meldung</em>)</li>
  </ol>
  <h2 id="dokumen-yang-diperlukan-untuk-travel-reimbursement">
    Dokumen yang Diperlukan untuk Travel Reimbursement
  </h2>
  <ol>
    <li>
      Formulir <em>travel reimbursement</em>
      <p class="file-download">
        <a href="/assets/files/welcome-meeting-oead-01-travelexpenses-refund-template-docx.docx"><span class="file-name">travelexpenses_refund_template.docx</span><span class="file-size">108.2 KB</span></a>
      </p>
    </li>
    <li>Tiket dan/atau <em>boarding pass</em></li>
    <li><em>Booking confirmation</em>, jika ada</li>
    <li><em>Payment receipt</em>, jika pembayaran menggunakan kartu debit/kartu kredit/transfer</li>
  </ol>
  <h2 id="langkah-langkah">Langkah-Langkah</h2>
  <ol>
    <li>
      Buat janji temu <em>(appointment)</em> terlebih dahulu <em>(</em><a href="https://outlook.office.com/book/OeADRegionalOfficeVienna@oead.at/?ismsaljsauthenabled=true" target="_blank" rel="noopener noreferrer"><em>link</em></a><em>)</em> kemudian datang sesuai dengan <em>appointment</em> yang sudah ditentukan. Pastikan bawa seluruh berkas yang dibutuhkan.
    </li>
    <li>
      Sampaikan bahwa kita adalah penerima beasiswa EMG dan hendak melakukan konfirmasi <em>scholarship</em> dan <em>travel reimbursement</em>. Serahkan seluruh berkas yang dibutuhkan.
    </li>
    <li>
      Ikuti arahan selanjutnya dari pihak petugas. Akan ada beberapa penjelasan yang nantinya akan diberikan oleh pihak petugas terkait dengan ketentuan-ketentuan beasiswa EMG.
    </li>
    <li>Selesai</li>
  </ol>
  <h2 id="catatan-pengalaman-pribadi">Catatan Pengalaman Pribadi</h2>
  <ul>
    <li>
      Untuk proses <em>travel reimbursement</em>, pastikan seluruh dokumen yang dibutuhkan sudah lengkap. Jika tidak lengkap maka proses <em>travel reimbursment</em> tidak bisa dilakukan saat itu juga (ditunda/menyusul).
    </li>
    <li>
      Tiket dan/atau <em>boarding pass</em> harus <strong>ASLI</strong>. Jadi, pastikan tiket dan/atau <em>boarding pass</em> tersebut tidak hilang.
    </li>
  </ul>
