  <h2 id="pendahuluan">Pendahuluan</h2>
  <p>
    Setelah pendaftaran OGK selesai (dibuktikan dengan <em>social security number</em>), langkah selanjutnya adalah melakukan pembuatan <em>e-card</em>. <em>e-Card</em> ini yang kemudian akan digunakan untuk berbagai kebutuhan, termasuk yang berkaitan dengan <em>health insurance</em>.
  </p>
  <h2 id="persyaratan">Persyaratan</h2>
  <ul>
    <li>Pas foto dengan kriteria <em>EU Passport</em></li>
    <li><em>Social security number</em> (nomor asuransi)</li>
  </ul>
