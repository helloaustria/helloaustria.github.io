  <h2 id="pendahuluan">Pendahuluan</h2>
  <p>
    Registrasi alamat adalah langkah awal yang pertama kali perlu dilakukan setelah pertama kali tiba di Austria dan melakukan proses <em>move in</em>. Tujuan dari proses ini adalah untuk meregistrasikan domisili tempat tinggal kita selama berada di Austria dan mendapatkan dokumen <em>bestatigung der meldung</em> sebagai bukti konfirmasi. Proses ini harus diselesaikan dalam <strong><u>3 hari</u></strong> setelah ketibaan di Austria.
  </p>
  <h2 id="dokumen-yang-diperlukan">Dokumen yang Diperlukan</h2>
  <ul>
    <li>Paspor</li>
    <li>
      Dokumen <em>meldezettel</em> yang telah ditanda tangani oleh <em>landlord</em> (unduh <a href="https://www.wien.gv.at/pdf/ma62/meldezettel.pdf" target="_blank" rel="noopener noreferrer">disini</a>)
      <p>Untuk panduan pengisian <em>meldezettel</em>, bisa melihat gambar sebagai berikut:</p>
      <figure class="guide-figure">
        <img src="/assets/images/registrasi-alamat-01-panduan-pengisian-meldezettel.png" alt="Gambar 1. Panduan pengisian meldezettel" width="1654" height="2339" loading="eager" decoding="async" fetchpriority="high" style="width:auto;max-width:min(400px,100%)">
        <figcaption>Gambar 1. Panduan pengisian <em>meldezettel</em></figcaption>
      </figure>
    </li>
  </ul>
  <h2 id="biaya">Biaya</h2>
  <p>Euro 42 (per 2025), <em>cashless only</em></p>
  <h2 id="langkah-langkah">Langkah-Langkah</h2>
  <ol>
    <li>
      Datang ke kantor registrasi alamat setempat sesuai dengan domisili akomodasi masing-masing. Kantor ini <strong><u>berbeda-beda</u></strong> setiap domisilinya, jadi tanyakan ke <em>landlord</em> ke kantor setempat mana kita bisa meregistrasikan alamat kita. Untuk proses ini, tidak perlu membuat janji temu. Cukup datang sepagi mungkin (disarankan antara jam 9 pagi s.d. 11 siang).
    </li>
    <li>Setelah sampai di kantor, ambil nomor antrian. Tunggu hingga nomor antrian dipanggil.</li>
    <li>Setelah nomor antrian dipanggil, temui petugas kemudian serahkan seluruh berkas yang diminta.</li>
    <li>
      Berkas akan diproses oleh petugas. Jika oke, proses selanjutnya dilanjutkan dengan pembayaran biaya administrasi yang diperlukan.
    </li>
    <li>
      Setelah seluruh rangkaian proses selesai, petugas akan memberikan dokumen <em>proof of address</em> <em>(bestatigung der meldung)</em>. <strong>PENTING!</strong> untuk <em>scan</em> dokumen ini karena akan digunakan untuk berbagai keperluan selama hidup di Austria.
    </li>
    <li>Selesai.</li>
  </ol>
