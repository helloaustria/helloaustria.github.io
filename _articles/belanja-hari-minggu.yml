  <p>
    Sebagian besar toko di Austria tutup di hari Minggu. Jadi, pastikan sudah berbelanja maksimal hari Sabtu setiap minggunya. Akan tetapi, jika mendadak perlu membeli bahan pokok di hari Minggu, beberapa toko tetap buka. Misalkan, toko di beberapa <em>gas station</em> dan stasiun kereta tetap buka di hari Minggu.
