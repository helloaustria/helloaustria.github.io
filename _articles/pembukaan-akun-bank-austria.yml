  <h2 id="pendahuluan">Pendahuluan</h2>
  <p>
    Akun bank Austria sangat penting untuk berbagai kehidupan ekonomi selama di Austria. Mulai dari menerima <em>stipend</em>, pendaftaran berbagai fasilitas, hingga transaksi sehari-hari sangat bergantung ke perbankan. Untuk penerima beasiswa EMG, sangat disarankan membuka akun Bank Austria.
  </p>
  <h2 id="persyaratan">Persyaratan</h2>
  <ul>
    <li>Paspor</li>
    <li><em>Student ID card</em>, <u>khusus rekening </u><em><u>student</u></em></li>
    <li>Dokumen <em>proof of address</em> <em>(bestatigung der meldung)</em></li>
  </ul>
  <h2 id="prosedur">Prosedur</h2>
  <ol>
    <li>
      Buat janji <em>(appointment)</em> melalui tautan sebagai berikut: <a href="https://www.bankaustria.at/produktuebersicht.jsp#tab57354" target="_blank" rel="noopener noreferrer">https://www.bankaustria.at/produktuebersicht.jsp#tab57354</a>
    </li>
    <li>
      Datang ke cabang Bank Austria sesuai tempat, tanggal, dan waktu <em>appointment</em> yang sudah dibuat.
    </li>
    <li>
      Temui petugas, sampaikan bahwa Anda adalah seorang <em>international student</em> dan hendak membuka akun Bank Austria.
    </li>
    <li>
      Serahkan seluruh berkas yang telah disiapkan, kemudian ikuti seluruh instruksi yang diberikan oleh petugas.
    </li>
    <li>Selesai.</li>
  </ol>
  <h2 id="catatan-pengalaman-pribadi">Catatan Pengalaman Pribadi</h2>
  <ul>
    <li>
      Kartu ATM akan dikirimkan ke alamat Austria masing-masing (sesuai <em>proof of address</em>) dalam rentang waktu 1-2 minggu setelah aplikasi pembukaan akun disetujui.
    </li>
    <li>
      Jika <em>appointment</em> diatas jam 12 siang, maka untuk masuk kedalam Bank Austria:
      <ul>
        <li>Tunggu seseorang yang masuk ke dalam bank (karena perlu kartu), atau</li>
        <li>Ketuk kaca hingga ada petugas yang menghampiri.</li>
      </ul>
    </li>
    <li>
      <strong>Rekomendasi:</strong> Unduh aplikasi Bank Austria (Android/iOS) sebelum <em>appointment</em> karena pada saat proses pembukaan akun sekalian dengan <em>setup</em> akun <em>mobile banking</em>.
      <ul>
        <li>
          Khusus Android, pastikan ganti profil <em>country</em> menjadi Austria terlebih dahulu. Aplikasi Bank Austria hanya tersedia untuk regional Austria.
        </li>
      </ul>
    </li>
    <li>
      <strong>Aplikasi:</strong> Ada 2 jenis <em>password</em> yaitu <strong>PIN</strong> dan <strong>ATC</strong>.
      <ul>
        <li>PIN digunakan untuk masuk ke dalam aplikasi.</li>
        <li>ATC digunakan untuk mengonfirmasi transaksi (misal, transfer dana)</li>
      </ul>
    </li>
  </ul>
